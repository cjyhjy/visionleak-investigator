name: No-model acceptance

on:
  push:
    branches: [main]
    paths-ignore: ['reports/**', 'WORKLOG.md', 'STATUS.json']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: no-model-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Real Core / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.12.13'
          enable-cache: false
      - name: Install frozen Python dependencies (no agent extra)
        run: uv sync --frozen
      - name: Fetch the hash-locked public Core release
        run: .venv/bin/python scripts/record.py ci-fetch .venv/bin/python scripts/fetch_core.py --out .cache/core.zip
      - name: Install Core and explicitly record this platform runtime
        run: .venv/bin/python scripts/record.py ci-bootstrap .venv/bin/python scripts/bootstrap_core.py --archive .cache/core.zip --migrate-runtime --receipt reports/ci/runtime-migration.json
      - name: Regression and fresh acceptance (Linux network namespace disabled)
        if: runner.os == 'Linux'
        run: |
          sudo env "PATH=$PATH" unshare --net setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups .venv/bin/python scripts/record.py ci-regression .venv/bin/python -m pytest -q --junitxml=reports/ci/junit.xml
          sudo env "PATH=$PATH" unshare --net setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups .venv/bin/python scripts/record.py ci-fresh-audit .venv/bin/python scripts/ci_acceptance.py --out runs/ci-acceptance
          sudo env "PATH=$PATH" unshare --net setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups .venv/bin/python scripts/record.py ci-scripted-controller .venv/bin/python scripts/controller_smoke.py --out runs/ci-controller
          sudo env "PATH=$PATH" unshare --net setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups .venv/bin/python scripts/record.py ci-evaluation-gates .venv/bin/python scripts/evaluation_gate_smoke.py --out runs/ci-evaluation-gates
          sudo env "PATH=$PATH" unshare --net setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups .venv/bin/python scripts/record.py ci-resources .venv/bin/vli evaluate --tasks 3 --out runs/ci-resources
          sudo env "PATH=$PATH" unshare --net setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups .venv/bin/python scripts/record.py ci-report-demo .venv/bin/python scripts/report_smoke.py --out runs/ci-report-demo
          sudo env "PATH=$PATH" unshare --net setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups .venv/bin/python scripts/record.py ci-catalog-execution .venv/bin/python scripts/catalog_smoke.py --tasks 3 --out runs/ci-catalog-execution
          sudo env "PATH=$PATH" unshare --net setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups .venv/bin/python scripts/record.py ci-lifecycle .venv/bin/python scripts/lifecycle_smoke.py --out runs/ci-lifecycle
          sudo env "PATH=$PATH" unshare --net setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups .venv/bin/python scripts/record.py ci-plan-check .venv/bin/python scripts/plan_check_smoke.py --out runs/ci-plan-check
          sudo env "PATH=$PATH" unshare --net setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups .venv/bin/python scripts/record.py ci-partial-report .venv/bin/python scripts/partial_report_smoke.py --out runs/ci-partial-report
      - name: Regression and fresh acceptance (macOS)
        if: runner.os == 'macOS'
        run: |
          .venv/bin/python scripts/record.py ci-regression .venv/bin/python -m pytest -q --junitxml=reports/ci/junit.xml
          .venv/bin/python scripts/record.py ci-fresh-audit .venv/bin/python scripts/ci_acceptance.py --out runs/ci-acceptance
          .venv/bin/python scripts/record.py ci-scripted-controller .venv/bin/python scripts/controller_smoke.py --out runs/ci-controller
          .venv/bin/python scripts/record.py ci-evaluation-gates .venv/bin/python scripts/evaluation_gate_smoke.py --out runs/ci-evaluation-gates
          .venv/bin/python scripts/record.py ci-resources .venv/bin/vli evaluate --tasks 3 --out runs/ci-resources
          .venv/bin/python scripts/record.py ci-report-demo .venv/bin/python scripts/report_smoke.py --out runs/ci-report-demo
          .venv/bin/python scripts/record.py ci-catalog-execution .venv/bin/python scripts/catalog_smoke.py --tasks 3 --out runs/ci-catalog-execution
          .venv/bin/python scripts/record.py ci-lifecycle .venv/bin/python scripts/lifecycle_smoke.py --out runs/ci-lifecycle
          .venv/bin/python scripts/record.py ci-plan-check .venv/bin/python scripts/plan_check_smoke.py --out runs/ci-plan-check
          .venv/bin/python scripts/record.py ci-partial-report .venv/bin/python scripts/partial_report_smoke.py --out runs/ci-partial-report
      - name: Preserve commands, failures, platform locks and real audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: real-core-${{ matrix.os }}-${{ github.sha }}
          retention-days: 14
          path: |
            reports/ci/
            reports/logs/
            reports/commands.jsonl
            runs/ci-acceptance/
            runs/ci-controller/
            runs/ci-evaluation-gates/
            runs/ci-resources/
            runs/ci-report-demo/
            runs/ci-catalog-execution/
            runs/ci-lifecycle/
            runs/ci-plan-check/
            runs/ci-partial-report/
            core.runtime.lock.json
