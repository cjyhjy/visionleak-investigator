[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "visionleak-investigator"
version = "0.1.0"
description = "Evidence-bound local image dataset investigator"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jsonschema==4.26.0",
    "pillow==12.3.0",
    "psutil==7.2.2",
]

[project.scripts]
vli = "visionleak_investigator.cli:main"

[project.optional-dependencies]
agent = [
    "openjiuwen==0.1.19.post2",
]

[dependency-groups]
dev = ["pytest==9.0.3"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
